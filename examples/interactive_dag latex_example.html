        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "T1 (Vertebrates)", "label": "T1 (Vertebrates)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "S1 (Mammals)", "label": "S1 (Mammals)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "S2 (Birds)", "label": "S2 (Birds)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "S3 (Predators)", "label": "S3 (Predators)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C1 (Dog)", "label": "C1 (Dog)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C2 (Cat)", "label": "C2 (Cat)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C3 (Bat)", "label": "C3 (Bat)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C4 (Sparrow)", "label": "C4 (Sparrow)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C5 (Eagle)", "label": "C5 (Eagle)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C6 (Shark)", "label": "C6 (Shark)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "T2 (Invertebrates)", "label": "T2 (Invertebrates)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "S4 (Insects)", "label": "S4 (Insects)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "S5 (Small Animals)", "label": "S5 (Small Animals)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "S6 (Flying Creatures)", "label": "S6 (Flying Creatures)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C7 (Ant)", "label": "C7 (Ant)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C8 (Bee)", "label": "C8 (Bee)", "shape": "dot", "size": 10}, {"color": "#97c2fc", "id": "C9 (Mouse)", "label": "C9 (Mouse)", "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "T1 (Vertebrates)", "to": "S1 (Mammals)", "width": 1}, {"arrows": "to", "from": "T1 (Vertebrates)", "to": "S2 (Birds)", "width": 1}, {"arrows": "to", "from": "T1 (Vertebrates)", "to": "S3 (Predators)", "width": 1}, {"arrows": "to", "from": "S1 (Mammals)", "to": "C1 (Dog)", "width": 1}, {"arrows": "to", "from": "S1 (Mammals)", "to": "C2 (Cat)", "width": 1}, {"arrows": "to", "from": "S1 (Mammals)", "to": "C3 (Bat)", "width": 1}, {"arrows": "to", "from": "S2 (Birds)", "to": "C4 (Sparrow)", "width": 1}, {"arrows": "to", "from": "S2 (Birds)", "to": "C5 (Eagle)", "width": 1}, {"arrows": "to", "from": "S2 (Birds)", "to": "C3 (Bat)", "width": 1}, {"arrows": "to", "from": "S3 (Predators)", "to": "C2 (Cat)", "width": 1}, {"arrows": "to", "from": "S3 (Predators)", "to": "C5 (Eagle)", "width": 1}, {"arrows": "to", "from": "S3 (Predators)", "to": "C6 (Shark)", "width": 1}, {"arrows": "to", "from": "T2 (Invertebrates)", "to": "S4 (Insects)", "width": 1}, {"arrows": "to", "from": "T2 (Invertebrates)", "to": "S5 (Small Animals)", "width": 1}, {"arrows": "to", "from": "T2 (Invertebrates)", "to": "S6 (Flying Creatures)", "width": 1}, {"arrows": "to", "from": "S4 (Insects)", "to": "C7 (Ant)", "width": 1}, {"arrows": "to", "from": "S4 (Insects)", "to": "C8 (Bee)", "width": 1}, {"arrows": "to", "from": "S5 (Small Animals)", "to": "C1 (Dog)", "width": 1}, {"arrows": "to", "from": "S5 (Small Animals)", "to": "C7 (Ant)", "width": 1}, {"arrows": "to", "from": "S5 (Small Animals)", "to": "C9 (Mouse)", "width": 1}, {"arrows": "to", "from": "S6 (Flying Creatures)", "to": "C3 (Bat)", "width": 1}, {"arrows": "to", "from": "S6 (Flying Creatures)", "to": "C4 (Sparrow)", "width": 1}, {"arrows": "to", "from": "S6 (Flying Creatures)", "to": "C8 (Bee)", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
